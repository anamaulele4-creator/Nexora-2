[project]
name = "connector-ai-backend"
version = "0.1.0"
description = "CONNECTOR AI — API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "asyncpg>=0.30",
  "redis>=5.0",
  "argon2-cffi>=23.1",
  "PyJWT>=2.9",
  "httpx>=0.27",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "asgi-lifespan>=2.1", "respx>=0.22"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["../tests/backend"]
pythonpath = [".", ".."]
