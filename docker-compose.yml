# CONNECTOR AI · ambiente local
#   docker compose up -d postgres redis      -> só as dependências (desenvolvimento local)
#   docker compose --profile app up --build  -> tudo: BD, Redis, migrações, API e frontend
name: connector-ai

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-connector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-connector_ai}
      TZ: UTC
      PGTZ: UTC
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    profiles: ["app"]
    build: { context: ., dockerfile: infrastructure/docker/backend.Dockerfile }
    working_dir: /app
    command: ["python", "database/migrate.py", "up", "--seed"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-connector}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-connector_ai}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    profiles: ["app"]
    build: { context: ., dockerfile: infrastructure/docker/backend.Dockerfile }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-connector}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-connector_ai}
      REDIS_URL: redis://redis:6379/0
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
      args:
        API_URL: http://api:8000
    environment:
      API_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
